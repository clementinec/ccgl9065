<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Upcycling: keep useful fabric and redesign it</title>
  <desc id="desc">Illustrative example: worn jeans with intact panels are cut and stitched into a patchwork tote. A higher-value use is the design aim; a lower environmental impact still needs evidence about processing, use and what the bag replaces.</desc>
