<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Follow a pair of jeans through six life stages</title>
  <desc id="desc">Cotton growing, fabric production, making jeans, transport and retail, wearing and washing, then collection and another life or disposal. Each stage has different environmental pressures.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5b6d7b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="430" rx="12" fill="#fbf8f1"/>
  <g fill="none" stroke="#c2cbd2" stroke-width="3" marker-end="url(#arrow)">
    <path d="M167 159H211"/><path d="M363 159H407"/><path d="M559 159H603"/><path d="M755 159H799"/><path d="M951 159H995"/>
  </g>
  <g fill="#eeeef4"><circle cx="100" cy="154" r="66"/><circle cx="296" cy="154" r="66"/><circle cx="492" cy="154" r="66"/><circle cx="688" cy="154" r="66"/><circle cx="884" cy="154" r="66"/><circle cx="1080" cy="154" r="66"/></g>
  <g fill="none" stroke="#4356b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 194V153M100 179L80 170M100 181L118 170"/><path d="M78 153C53 145 74 117 91 128C96 99 121 115 117 131C144 122 144 154 119 159Z" fill="#fff"/>
    <path d="M255 186V136L278 149V130L301 146V111H318V149H336V186Z"/><path d="M267 169H322"/>
    <path d="M466 116H517L524 196H500L491 151L482 196H458Z" fill="#4356b3"/><path d="M467 132H515M490 118V148" stroke="#fbf8f1" stroke-width="3"/>
    <path d="M646 132H695V174H646ZM695 146H715L730 162V174H695"/><circle cx="660" cy="182" r="9" fill="#fbf8f1"/><circle cx="715" cy="182" r="9" fill="#fbf8f1"/>
    <rect x="850" y="113" width="68" height="83" rx="5"/><path d="M853 134H915"/><circle cx="884" cy="166" r="20"/><path d="M870 168Q882 157 898 166"/>
    <path d="M1048 171L1068 137H1095L1115 171L1102 194H1061Z"/><path d="M1068 137L1079 139M1095 137L1097 147M1115 171L1106 177"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#102a43">
    <g font-size="17" font-weight="700" fill="#c96753"><text x="100" y="47">01</text><text x="296" y="47">02</text><text x="492" y="47">03</text><text x="688" y="47">04</text><text x="884" y="47">05</text><text x="1080" y="47">06</text></g>
    <g font-size="25" font-weight="700"><text x="100" y="263">Grow</text><text x="296" y="263">Make fabric</text><text x="492" y="263">Make jeans</text><text x="688" y="263">Move &amp; sell</text><text x="884" y="263">Wear &amp; care</text><text x="1080" y="263">Next life?</text></g>
    <g font-size="20" fill="#5b6d7b"><text x="100" y="304">Land + water</text><text x="296" y="304">Dye + energy</text><text x="492" y="304">Cut + finish</text><text x="688" y="304">Fuel + shops</text><text x="884" y="304">Wash + dry</text><text x="1080" y="304">Sort + process</text></g>
    <text x="600" y="388" font-size="25" font-weight="700">The price tag shows one number. The life cycle contains many.</text>
  </g>
</svg>
